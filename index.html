<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Электронная гарантия</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f4f1;
    --card: #ffffff;
    --ink: #15171a;
    --muted: #6b7178;
    --line: #e3e5e1;
    --accent: #1f7a4d;
    --accent-soft: #e3f2ea;
    --warn: #b7791f;
    --warn-soft: #fbf0dc;
    --bad: #c0392b;
    --bad-soft: #fbe5e2;
    --track: #eceee9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1113;
      --card: #171a1d;
      --ink: #eef0ee;
      --muted: #8d949b;
      --line: #262a2e;
      --accent: #3ccf86;
      --accent-soft: #15301f;
      --warn: #e5a93b;
      --warn-soft: #33270f;
      --bad: #ef6b5b;
      --bad-soft: #3a1915;
      --track: #23272b;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Manrope", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 32px 16px 48px; }

  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
  .shield {
    width: 34px; height: 34px; border-radius: 10px;
    background: var(--accent); color: #fff;
    display: grid; place-items: center;
  }
  .brand b { font-size: 15px; letter-spacing: .02em; }
  .brand span { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }

  h1 { font-size: clamp(26px, 6vw, 36px); line-height: 1.1; margin: 0 0 10px; font-weight: 800; letter-spacing: -.02em; }
  .lead { color: var(--muted); margin: 0 0 22px; font-size: 15px; }

  form { display: flex; gap: 8px; }
  .field { flex: 1; position: relative; }
  .field span {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    color: var(--muted); font-family: "JetBrains Mono", monospace; font-size: 17px;
  }
  input {
    width: 100%; height: 54px; border-radius: 14px;
    border: 1.5px solid var(--line); background: var(--card); color: var(--ink);
    padding: 0 16px 0 36px; font: 600 18px "JetBrains Mono", monospace; letter-spacing: .08em;
    outline: none; transition: border-color .15s;
  }
  input:focus { border-color: var(--accent); }
  button {
    height: 54px; padding: 0 22px; border: 0; border-radius: 14px;
    background: var(--ink); color: var(--bg); font: 700 15px "Manrope", sans-serif; cursor: pointer;
  }
  button:active { transform: scale(.98); }
  .err { color: var(--bad); font-size: 14px; margin-top: 10px; min-height: 20px; }

  #result { margin-top: 18px; }
  .head {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 18px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
  }
  .head small { display: block; color: var(--muted); font-size: 12px; font-weight: 500; margin-bottom: 4px; }
  .head strong { font-size: 16px; }
  .head .mono { font-family: "JetBrains Mono", monospace; }

  .summary { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 12px; }
  .pill { font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); }

  .list { display: grid; gap: 10px; }
  .item {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px;
  }
  .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .cat { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  .name { font-weight: 700; font-size: 16px; margin-top: 3px; line-height: 1.3; }
  .badge { flex: none; font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
  .ok   { background: var(--accent-soft); color: var(--accent); }
  .soon { background: var(--warn-soft); color: var(--warn); }
  .over { background: var(--bad-soft);  color: var(--bad); }

  .bar { height: 6px; background: var(--track); border-radius: 99px; overflow: hidden; margin: 14px 0 10px; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 99px; background: var(--accent); transform-origin: left; }
  .bar i.soon { background: var(--warn); }
  .bar i.over { background: var(--bad); }
  .meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); gap: 10px; flex-wrap: wrap; }
  .meta b { color: var(--ink); font-weight: 600; }

  .cal { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; font-size: 13px; font-weight: 700;
         color: var(--accent); text-decoration: none; }
  .cal:hover { text-decoration: underline; }
  .calall { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 48px; margin: 0 0 12px;
            border-radius: 14px; background: var(--accent-soft); color: var(--accent); font: 700 14px "Manrope", sans-serif; }
  .calall small { font-weight: 500; opacity: .8; }

  footer { margin-top: 28px; color: var(--muted); font-size: 12px; text-align: center; }

  @media (max-width: 480px) {
    .head { grid-template-columns: 1fr 1fr; }
    .head > div:last-child { grid-column: 1 / -1; }
    button { padding: 0 16px; }
  }

  /* ===== Motion ===== */
  :root { --ease-out: cubic-bezier(.16, 1, .3, 1); --ease-io: cubic-bezier(.65, 0, .35, 1); }

  /* Интро: щит-пломба */
  #intro { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: var(--bg); }
  #intro .seal { width: 112px; height: 112px; border-radius: 30px; display: grid; place-items: center; background: var(--accent);
                 transform: scale(.6); opacity: 0; }
  #intro svg { width: 58px; height: 58px; color: #fff; overflow: visible; }
  #intro .outline { stroke-dasharray: 64; stroke-dashoffset: 64; }
  #intro .tick { stroke-dasharray: 14; stroke-dashoffset: 14; }
  #intro .ring { position: absolute; width: 112px; height: 112px; border-radius: 30px; border: 2px solid var(--accent); opacity: 0; }

  /* Проявление контента после интро */
  .rv { opacity: 0; }
  body.ready .rv { animation: rv .9s var(--ease-out) both; animation-delay: var(--d, 0ms); }
  @keyframes rv { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  h1 .ln { display: block; overflow: hidden; padding-bottom: .06em; }
  h1 .ln > span { display: block; transform: translateY(105%); }
  body.ready h1 .ln > span { animation: up 1s var(--ease-out) both; animation-delay: var(--d, 0ms); }
  @keyframes up { to { transform: none; } }
  .brand .shield { opacity: 0; }
  body.landed .brand .shield { opacity: 1; }

  /* Кнопка в процессе */
  button[type=submit] { position: relative; min-width: 128px; transition: background .2s; }
  button[type=submit].busy { color: transparent; pointer-events: none; }
  button[type=submit].busy::after { content: ""; position: absolute; inset: 0; margin: auto; width: 18px; height: 18px;
    border-radius: 50%; border: 2.5px solid var(--bg); border-right-color: transparent; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Скелетон + сканирующая линия */
  .skel { position: relative; display: grid; gap: 10px; overflow: hidden; border-radius: 18px; }
  .skel div { height: 92px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); }
  .skel div:first-child { height: 74px; }
  .skel::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 90px;
    background: linear-gradient(to bottom, transparent, color-mix(in srgb, var(--accent) 18%, transparent) 70%, var(--accent) 100%);
    border-bottom: 2px solid var(--accent); animation: scan 1s var(--ease-io) infinite; }
  @keyframes scan { from { transform: translateY(-100%); } to { transform: translateY(420px); } }
  .skel.out { animation: fadeout .25s ease forwards; }
  @keyframes fadeout { to { opacity: 0; transform: scale(.985); } }

  /* Каскад результатов */
  .seq { opacity: 0; transform: translateY(26px) scale(.97); filter: blur(6px); }
  .seq.on { opacity: 1; transform: none; filter: none;
            transition: opacity .6s var(--ease-out), transform .8s var(--ease-out), filter .6s var(--ease-out); }
  .bar i { transition: width 1.1s var(--ease-out); }
  .badge { transition: transform .4s var(--ease-out); }
  .seq:not(.on) .badge { transform: scale(.6); }
  .shake { animation: shake .45s var(--ease-io); }
  @keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }

  @media (prefers-reduced-motion: reduce) {
    #intro { display: none; }
    .rv, .seq, .brand .shield { opacity: 1 !important; transform: none !important; filter: none !important; animation: none !important; transition: none !important; }
    h1 .ln > span { transform: none !important; animation: none !important; }
    .bar i { transition: none; }
    .skel::after { animation: none; }
  }
</style>
</head>
<body>
<div id="intro" aria-hidden="true">
  <div class="ring"></div>
  <div class="seal">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path class="outline" pathLength="64" d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6l8-3z"/>
      <path class="tick" pathLength="14" d="M8.5 12l2.5 2.5 4.5-5"/>
    </svg>
  </div>
</div>
<div class="wrap">
  <div class="brand">
    <div class="shield">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6l8-3z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>
    </div>
    <div class="rv" style="--d:0ms"><b>Электронная гарантия</b><span>Сборка ПК</span></div>
  </div>

  <h1><span class="ln"><span style="--d:80ms">Проверка</span></span><span class="ln"><span style="--d:170ms">гарантии</span></span></h1>
  <p class="lead rv" style="--d:300ms">Введите номер заказа, чтобы увидеть сроки гарантии на комплектующие.</p>

  <form id="f" class="rv" style="--d:400ms" autocomplete="off">
    <label class="field"><span>№</span>
      <input id="q" inputmode="numeric" placeholder="0001" maxlength="12" aria-label="Номер заказа">
    </label>
    <button type="submit">Проверить</button>
  </form>
  <div class="err" id="err"></div>

  <div id="result"></div>

  <footer class="rv" style="--d:520ms">Гарантийный срок отсчитывается с даты покупки. Сохраняйте номер заказа.</footer>
</div>

<script>
// ===== Заказы =====
// Даты в формате ГГГГ-ММ-ДД. Можно указать until (дата окончания) или months (срок от даты покупки).
const ORDERS = {
  "0001": {
    customer: "Акбарали Б.",
    date: "2026-10-25",
    items: [
      { cat: "Видеокарта",       name: "GIGABYTE Radeon RX 9060 XT GAMING OC 16 ГБ", until: "2029-10-25" },
      { cat: "Процессор",        name: "AMD Ryzen 5 9600X",                          until: "2027-10-25" },
      { cat: "Материнская плата",name: "GIGABYTE B850M D3HP",                        until: "2029-10-25" },
      { cat: "Оперативная память",name: "Apacer NOX DDR5 32 ГБ (2×16)",              until: "2029-10-25" },
      { cat: "Накопитель",       name: "Kingston NV3 1 ТБ M.2 NVMe",                 until: "2029-10-25" },
      { cat: "Блок питания",     name: "Chieftec Vita 750W",                         until: "2028-10-25" },
      { cat: "Кулер",            name: "ARDOR GAMING Windstorm D21",                 until: "2027-10-25" },
      { cat: "Корпус",           name: "ARDOR GAMING Rare M6",                       months: 18 }
    ]
  }
};

// ===== Логика =====
const DAY = 86400000;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addMonths = (d, n) => { const r = new Date(d); r.setMonth(r.getMonth() + n); return r; };
const fmt = d => d.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit", year: "numeric" });
const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };

function plural(n, one, few, many) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
}

// Остаток в виде «1 г. 11 мес. 30 дн.»
function leftText(from, to) {
  if (to <= from) return null;
  let y = to.getFullYear() - from.getFullYear();
  let m = to.getMonth() - from.getMonth();
  let d = to.getDate() - from.getDate();
  if (d < 0) { m--; d += new Date(to.getFullYear(), to.getMonth(), 0).getDate(); }
  if (m < 0) { y--; m += 12; }
  const parts = [];
  if (y) parts.push(`${y} ${plural(y, "год", "года", "лет")}`);
  if (m) parts.push(`${m} мес.`);
  if (d) parts.push(`${d} ${plural(d, "день", "дня", "дней")}`);
  return parts.join(" ");
}

// ===== Календарь =====
const ymd = d => `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
const calTitle = it => `Конец гарантии: ${it.cat} — ${it.name}`;
const calDetails = (key, it) => `Гарантия до ${fmt(it.end)}. Заказ №${key}. Если есть проблемы с комплектующим — обратиться по гарантии до этой даты.\n${location.origin}${location.pathname}?order=${key}`;

// Ссылка на добавление события в Google Календарь (событие на весь день в дату окончания)
function gcalUrl(key, it) {
  const next = new Date(it.end); next.setDate(next.getDate() + 1);
  const p = new URLSearchParams({ action: "TEMPLATE", text: calTitle(it), dates: `${ymd(it.end)}/${ymd(next)}`, details: calDetails(key, it) });
  return "https://calendar.google.com/calendar/render?" + p.toString();
}

// .ics со всеми действующими гарантиями + напоминания за 30 и 7 дней
function downloadIcs(key, items) {
  const escI = t => t.replace(/[\\;,]/g, m => "\\" + m).replace(/\n/g, "\\n");
  const stamp = new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
  const ev = items.filter(i => i.left > 0).map((it, n) => {
    const next = new Date(it.end); next.setDate(next.getDate() + 1);
    return ["BEGIN:VEVENT", `UID:warranty-${key}-${n}-${ymd(it.end)}@warranty-pc`, `DTSTAMP:${stamp}`,
      `DTSTART;VALUE=DATE:${ymd(it.end)}`, `DTEND;VALUE=DATE:${ymd(next)}`,
      `SUMMARY:${escI(calTitle(it))}`, `DESCRIPTION:${escI(calDetails(key, it))}`, "TRANSP:TRANSPARENT",
      "BEGIN:VALARM", "ACTION:DISPLAY", "TRIGGER:-P30D", `DESCRIPTION:${escI("Через 30 дней заканчивается гарантия: " + it.name)}`, "END:VALARM",
      "BEGIN:VALARM", "ACTION:DISPLAY", "TRIGGER:-P7D", `DESCRIPTION:${escI("Через 7 дней заканчивается гарантия: " + it.name)}`, "END:VALARM",
      "END:VEVENT"].join("\r\n");
  });
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//warranty-pc//RU", "CALSCALE:GREGORIAN", "METHOD:PUBLISH",
    `X-WR-CALNAME:Гарантия, заказ №${key}`, ...ev, "END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics], { type: "text/calendar;charset=utf-8" }));
  a.download = `garantiya-${key}.ics`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

function render(key) {
  const res = document.getElementById("result");
  const err = document.getElementById("err");
  const order = ORDERS[key];
  res.innerHTML = "";
  if (!order) { err.textContent = key ? "Заказ с таким номером не найден." : "Введите номер заказа."; return; }
  err.textContent = "";

  const start = parse(order.date);
  const now = today();
  let active = 0;

  const items = order.items.map(it => {
    const end = it.until ? parse(it.until) : addMonths(start, it.months);
    const total = end - start;
    const left = Math.round((end - now) / DAY);
    const pct = Math.max(0, Math.min(100, (end - now) / total * 100));
    const state = left <= 0 ? "over" : left <= 60 ? "soon" : "ok";
    if (left > 0) active++;
    return { ...it, end, left, pct, state };
  }).sort((a, b) => a.end - b.end);

  const minEnd = items.find(i => i.left > 0);

  res.innerHTML = `
    <div class="head seq">
      <div><small>Заказ</small><strong class="mono">№${esc(key)}</strong></div>
      <div><small>Дата покупки</small><strong>${fmt(start)}</strong></div>
      <div><small>Покупатель</small><strong>${esc(order.customer)}</strong></div>
    </div>
    <div class="summary seq">
      <span class="pill">На гарантии: ${active} из ${items.length}</span>
      ${minEnd ? `<span class="pill">Ближайшее окончание: ${fmt(minEnd.end)}</span>` : ""}
    </div>
    ${active ? `<button type="button" class="calall seq" id="icsBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18M12 13v5M9.5 15.5h5"/></svg>
      Добавить все сроки в календарь <small>(.ics)</small></button>` : ""}
    <div class="list">
      ${items.map((it, i) => {
        const lt = leftText(now, it.end);
        const badge = it.state === "over" ? "Истекла" : `${it.left} ${plural(it.left, "день", "дня", "дней")}`;
        return `
        <div class="item seq">
          <div class="row">
            <div>
              <div class="cat">${esc(it.cat)}</div>
              <div class="name">${esc(it.name)}</div>
            </div>
            <span class="badge ${it.state}" ${it.left > 0 ? `data-n="${it.left}"` : ""}>${badge}</span>
          </div>
          <div class="bar"><i class="${it.state}" data-w="${it.pct.toFixed(1)}"></i></div>
          <div class="meta">
            <span>Гарантия до <b>${fmt(it.end)}</b></span>
            <span>${lt ? "Осталось: <b>" + lt + "</b>" : "Срок гарантии истёк"}</span>
          </div>
          ${it.left > 0 ? `<a class="cal" href="${esc(gcalUrl(key, it))}" target="_blank" rel="noopener">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
            В Google Календарь</a>` : ""}
        </div>`;
      }).join("")}
    </div>`;
  const btn = document.getElementById("icsBtn");
  if (btn) btn.onclick = () => downloadIcs(key, items);
  play(res);
}

// ===== Motion =====
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;

// Каскад: блоки по очереди, полоски заполняются, дни отсчитываются
function play(root) {
  const els = [...root.querySelectorAll(".seq")];
  els.forEach((el, i) => {
    const delay = calm ? 0 : i * 75;
    setTimeout(() => {
      el.classList.add("on");
      const bar = el.querySelector(".bar i");
      if (bar) setTimeout(() => bar.style.width = bar.dataset.w + "%", calm ? 0 : 180);
      const b = el.querySelector(".badge[data-n]");
      if (b) countUp(b, +b.dataset.n, calm ? 0 : 1100);
    }, delay);
  });
}

function countUp(el, n, ms) {
  const word = () => " " + plural(n, "день", "дня", "дней");
  if (!ms) { el.textContent = n + word(); return; }
  const t0 = performance.now();
  const tick = t => {
    const p = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - p, 4);
    el.textContent = Math.round(n * e) + word();
    if (p < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

// Проверка с эффектом сканирования
const btnGo = document.querySelector("button[type=submit]");
function check(key) {
  const res = document.getElementById("result");
  if (!ORDERS[key] || calm) {
    render(key);
    if (!ORDERS[key] && !calm) { const f = document.querySelector(".field"); f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake"); }
    return;
  }
  btnGo.classList.add("busy");
  res.innerHTML = `<div class="skel"><div></div><div></div><div></div><div></div></div>`;
  setTimeout(() => {
    res.firstElementChild.classList.add("out");
    setTimeout(() => { btnGo.classList.remove("busy"); render(key); }, 240);
  }, 900);
}

// Интро: щит рисуется и перелетает в шапку
function intro(done) {
  const box = document.getElementById("intro");
  if (calm || !box.animate) { box.remove(); document.body.classList.add("landed"); done(); return; }
  const seal = box.querySelector(".seal"), ring = box.querySelector(".ring");
  const E = "cubic-bezier(.16,1,.3,1)";
  seal.animate([{ transform: "scale(.6)", opacity: 0 }, { transform: "scale(1)", opacity: 1 }], { duration: 500, easing: E, fill: "forwards" });
  box.querySelector(".outline").animate([{ strokeDashoffset: 64 }, { strokeDashoffset: 0 }], { duration: 700, delay: 150, easing: "cubic-bezier(.65,0,.35,1)", fill: "forwards" });
  box.querySelector(".tick").animate([{ strokeDashoffset: 14 }, { strokeDashoffset: 0 }], { duration: 320, delay: 780, easing: E, fill: "forwards" });
  ring.animate([{ transform: "scale(1)", opacity: .7 }, { transform: "scale(1.9)", opacity: 0 }], { duration: 700, delay: 1000, easing: "ease-out" });

  setTimeout(() => {
    const from = seal.getBoundingClientRect(), to = document.querySelector(".brand .shield").getBoundingClientRect();
    const dx = (to.left + to.width / 2) - (from.left + from.width / 2), dy = (to.top + to.height / 2) - (from.top + from.height / 2);
    const k = to.width / from.width;
    seal.animate([{ transform: "none", borderRadius: "30px" }, { transform: `translate(${dx}px, ${dy}px) scale(${k})`, borderRadius: "30px" }],
                 { duration: 750, easing: "cubic-bezier(.7,0,.2,1)", fill: "forwards" });
    box.animate([{ backgroundColor: getComputedStyle(box).backgroundColor }, { backgroundColor: "transparent" }],
                { duration: 600, delay: 250, easing: "ease-out", fill: "forwards" });
    setTimeout(done, 380);
    setTimeout(() => { document.body.classList.add("landed"); box.remove(); }, 760);
  }, 1250);
}

const q = document.getElementById("q");
document.getElementById("f").addEventListener("submit", e => {
  e.preventDefault();
  const key = q.value.trim().replace(/\D/g, "").padStart(4, "0");
  q.value = q.value.trim() ? key : "";
  history.replaceState(null, "", key && q.value ? "?order=" + key : location.pathname);
  check(q.value ? key : "");
});

const initial = new URLSearchParams(location.search).get("order");
intro(() => {
  document.body.classList.add("ready");
  if (initial) { q.value = initial; setTimeout(() => check(initial.replace(/\D/g, "").padStart(4, "0")), 450); }
});
